name: Release

# Publishing used to mean a human, a long-lived API token and a terminal that
# could show a password prompt. Trusted publishing removes all three: PyPI
# mints a short-lived credential from this workflow's OIDC identity, so no
# secret is stored in the repository or on anyone's laptop.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Also publish to PyPI (for a tag that predates this workflow)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]" build twine

      # A tag that disagrees with pyproject.toml would publish a version
      # nobody asked for, and PyPI versions cannot be replaced. Fail here,
      # where the only cost is a red run.
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          echo "tag=$tag package=$pkg"
          test "$tag" = "$pkg"

      # Release notes come from the changelog, so a missing entry must fail
      # here rather than produce an empty release page after the tag is out.
      - name: Changelog documents this version
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/changelog_section.py "$GITHUB_REF_NAME" >/dev/null

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest -q

      - name: Build
        run: python -m build

      - name: Check the artifacts
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # A tag publishes; a manual run does not unless it asks to. That keeps
    # the pipeline exercisable without spending a version number, while
    # leaving a way to publish a tag pushed before this workflow existed --
    # deleting and re-pushing such a tag would turn its release into a draft.
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish
    environment:
      name: pypi
      url: https://pypi.org/project/claude-dot-display/
    permissions:
      id-token: write          # mints the short-lived PyPI credential
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    # Runs only after PyPI has accepted the upload: a release page pointing
    # at a version you cannot pip install is worse than a missing one, and
    # this ordering makes the two publications agree or neither happen.
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write          # creates the release and uploads its assets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Release notes from the changelog
        run: python scripts/changelog_section.py "$GITHUB_REF_NAME" > notes.md

      # Attaching the same artifacts that went to PyPI lets anyone check the
      # published wheel against the tagged source.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --notes-file notes.md dist/*
          fi
